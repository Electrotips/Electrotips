<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>ElectroTips PDF Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* TON DESIGN ORIGINAL (Fusionné) */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .content {
      max-width: 600px;
      width: 100%;
    }

    h2, p {
      text-align: center;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    /* BARRE DE FILTRE (Catégories) */
    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 18px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .tab.on {
      background: #4CAF50;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* LES CARTES DYNAMIQUES */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cat-wrapper {
      display: none; /* Masqué par défaut pour le filtrage */
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s, transform 0.4s;
    }

    .cat-wrapper.on {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      background: white;
      color: #333;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card img {
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin: 10px 0;
      font-size: 22px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 30px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #45a049;
    }

    footer {
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
      font-size: 14px;
      margin-top: 40px;
    }

    footer a {
      color: #add8e6;
      text-decoration: none;
      margin: 0 10px;
    }
  </style>
</head>

<body>

  <div class="main-container">
    <div class="content">
      <h2>📚 مكتبة ElectroTips</h2>
      <p>اختر الملف الذي تريد تحميله 👇</p>

      <div class="tabs">
        <button class="tab on" onclick="filter('el', this)">Electronics</button>
        <button class="tab" onclick="filter('et', this)">Electrotechnique</button>
        <button class="tab" onclick="filter('pn', this)">Pneumatics</button>
        <button class="tab" onclick="filter('mc', this)">Mechanics</button>
        <button class="tab" onclick="filter('au', this)">Automation</button>
      </div>

      <div class="cards" id="main-grid">
        </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ElectroTips Library. All rights reserved.</p>
    <a href="privacy.html">Privacy Policy</a> | 
    <a href="terms.html">Terms & Conditions</a>
  </footer>

  <script>(function(s){s.dataset.zone='10801343',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script>(function(s){s.dataset.zone='10802237',s.src='https://izcle.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <script>
    // Ton lien CSV Google Sheets
    const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qzcvFzvBizQ6qanNqhIP6GUYrv98St-kkbXmwUjI5J57oEWtfbPlIFam_79tHhncyVw89YgEnTg9/pub?output=csv";

    // Fonction pour transformer les liens Drive en liens images directs
    function getDirectImgUrl(url) {
      url = url.trim();
      if (url.includes("drive.google.com")) {
        let id = "";
        if (url.includes("/file/d/")) {
          id = url.split('/file/d/')[1].split('/')[0];
        } else if (url.includes("id=")) {
          id = url.split('id=')[1].split('&')[0];
        }
        if (id) {
          return `https://drive.google.com/uc?export=view&id=${id}`;
        }
      }
      return url;
    }

    async function loadLibrary() {
      try {
        const response = await fetch(csvURL);
        const data = await response.text();
        const separator = data.includes(';') ? ';' : ',';
        const rows = data.split('\n').slice(1);
        const grid = document.getElementById('main-grid');
        
        grid.innerHTML = ""; 

        rows.forEach(row => {
          const columns = row.split(separator); 
          if (columns.length >= 4 && columns[0].trim() !== "") {
            const titre = columns[0].trim();
            const categorie = columns[1].trim();
            const imageRaw = columns[2].trim();
            const lien = columns[3].trim();
            
            const directImg = getDirectImgUrl(imageRaw);
            
            const cardHTML = `
              <div class="cat-wrapper" data-c="${categorie}">
                <div class="card">
                  <img src="${directImg}" onerror="this.src='https://via.placeholder.com/300x150?text=ElectroTips+PDF'">
                  <h3>${titre}</h3>
                  <a href="download.html?file=${encodeURIComponent(lien)}" class="btn">تحميل</a>
                </div>
              </div>`;
            grid.innerHTML += cardHTML;
          }
        });

        // Affichage initial (Electronics)
        filter('el', document.querySelector('.tab.on'));

      } catch (e) {
        console.error("Erreur de chargement CSV:", e);
      }
    }

    // Fonction de filtrage
    function filter(cat, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      btn.classList.add('on');
      
      document.querySelectorAll('.cat-wrapper').forEach(item => {
        if (item.getAttribute('data-c') === cat) {
          item.style.display = "block";
          setTimeout(() => item.classList.add('on'), 10);
        } else {
          item.classList.remove('on');
          item.style.display = "none";
        }
      });
    }

    loadLibrary();
  </script>

</body>
</html>
