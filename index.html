<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مكتبة ElectroTips - Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-el: #fbbf24; --color-et: #3b82f6; --color-pn: #22d3ee; 
      --color-mc: #f87171; --color-au: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #1e3a8a, #2563eb); min-height: 100vh; color: #fff; }
    .wrap { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 38px; font-weight: 900; margin-bottom: 10px; text-align: center; }
    .sub { font-size: 16px; color: #bfdbfe; margin-bottom: 30px; text-align: center; }

    .tabs { background: rgba(255,255,255,.12); backdrop-filter: blur(8px); border-radius: 18px; padding: 6px; display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    .tab { padding: 10px 18px; border: none; border-radius: 12px; background: transparent; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
    .tab.on { background: #fff; color: #1d4ed8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
    .cat { display: none; opacity: 0; transform: translateY(15px); transition: 0.4s ease; }
    .cat.on { display: block; opacity: 1; transform: translateY(0); }

    .card { background: #fff; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; height: 100%; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card:hover { transform: scale(1.03); }

    .cat[data-c="el"] .card { border-top: 6px solid var(--color-el); }
    .cat[data-c="et"] .card { border-top: 6px solid var(--color-et); }
    .cat[data-c="pn"] .card { border-top: 6px solid var(--color-pn); }
    .cat[data-c="mc"] .card { border-top: 6px solid var(--color-mc); }
    .cat[data-c="au"] .card { border-top: 6px solid var(--color-au); }

    .ico-container { width: 100%; height: 140px; margin-bottom: 12px; display: flex; justify-content: center; overflow: hidden; }
    .pdf-img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 5px; }
    .ctitle { font-size: 15px; font-weight: 800; color: #111827; margin-bottom: 10px; line-height: 1.4; }
    .badge { background: #f3f4f6; color: #374151; font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 99px; margin-top: auto; }
  </style>
</head>
<body>

<div class="wrap">
  <h1>📚 مكتبة ElectroTips</h1>
  <p class="sub">تحميل الكتب التقنية بسهولة</p>

  <div class="tabs">
    <button class="tab on" onclick="filter('el', this)"><i class="fa-solid fa-microchip"></i> Electronics</button>
    <button class="tab" onclick="filter('et', this)"><i class="fa-solid fa-bolt"></i> Electrotechnique</button>
    <button class="tab" onclick="filter('pn', this)"><i class="fa-solid fa-wind"></i> Pneumatics</button>
    <button class="tab" onclick="filter('mc', this)"><i class="fa-solid fa-gears"></i> Mechanics</button>
    <button class="tab" onclick="filter('au', this)"><i class="fa-solid fa-robot"></i> Automation</button>
  </div>

  <div class="grid" id="main-grid"></div>
</div>

<script>
  const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8qzcvFzvBizQ6qanNqhIP6GUYrv98St-kkbXmwUjI5J57oEWtfbPlIFam_79tHhncyVw89YgEnTg9/pub?output=csv";

  // Fonction pour transformer les liens Drive /view en liens directs images
  function fixDriveUrl(url) {
    if (url.includes("drive.google.com")) {
      let id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1];
      return `https://drive.google.com/uc?export=view&id=${id}`;
    }
    return url;
  }

  async function loadLibrary() {
    try {
      const response = await fetch(csvURL);
      const data = await response.text();
      const separator = data.includes(';') ? ';' : ',';
      const rows = data.split('\n').slice(1);
      const grid = document.getElementById('main-grid');
      
      grid.innerHTML = ""; 

      rows.forEach(row => {
        const columns = row.split(separator); 
        if (columns.length >= 4 && columns[0].trim() !== "") {
          const [titre, categorie, image, lien] = columns;
          const directImg = fixDriveUrl(image.trim());
          
          const card = `
            <div class="cat" data-c="${categorie.trim()}">
              <a href="download.html?file=${encodeURIComponent(lien.trim())}" class="card">
                <div class="ico-container">
                  <img src="${directImg}" class="pdf-img" onerror="this.src='https://via.placeholder.com/150x200?text=PDF'">
                </div>
                <span class="ctitle">${titre.trim()}</span>
                <span class="badge">Download PDF</span>
              </a>
            </div>`;
          grid.innerHTML += card;
        }
      });
      filter('el', document.querySelector('.tab.on'));
    } catch (e) { console.error(e); }
  }

  function filter(cat, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.cat').forEach(item => {
      if (item.getAttribute('data-c') === cat) {
        item.style.display = "block";
        setTimeout(() => item.classList.add('on'), 10);
      } else {
        item.classList.remove('on');
        item.style.display = "none";
      }
    });
  }

  loadLibrary();
</script>
</body>
</html>
